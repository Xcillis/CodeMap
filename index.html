<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#152d35" />
    <title>CodeMap – Die Chroniken von Aetheria</title>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="Spielwelt von CodeMap"></div>
      <aside id="hud" aria-live="polite">
        <p class="eyebrow">HAUPTQUEST</p>
        <p id="quest-text">Sprich mit dem Arkanisten.</p>
      </aside>
      <section id="dialog" aria-modal="true" aria-labelledby="dialog-speaker" hidden>
        <div class="dialog-panel">
          <p id="dialog-speaker" class="eyebrow">ARKANIST ELDREN</p>
          <p id="dialog-text"></p>
          <button id="dialog-close" type="button">Verstanden</button>
        </div>
      </section>
      <section id="battle-panel" aria-labelledby="battle-title" hidden>
        <div class="battle-card">
          <p class="eyebrow" id="battle-title">RUNENSKRIPT – DIE ERSTE SCHLEIFE</p>
          <label for="program-source">Entscheidung von Moosling</label>
          <div class="editor-mode" role="group" aria-label="Programmierdarstellung">
            <button id="blocks-mode" type="button">Blocksprache</button>
            <button id="text-mode" type="button">Textmodus</button>
          </div>
          <div id="block-editor" aria-label="Blockeditor">
            <p class="block-intro">Baue einen Aktionsplan aus Wiederholungsblöcken.</p>
            <div id="loop-blocks"></div>
            <button id="add-loop-block" type="button">+ Wiederholungsblock</button>
          </div>
          <textarea id="program-source" spellcheck="false" aria-describedby="program-help" hidden></textarea>
          <p id="program-help">Wiederhole <code>moveToward()</code> oder <code>attack()</code> mit <code>repeat(1–6, ...)</code>. Der Plan darf höchstens zwölf Schritte haben.</p>
          <div class="battle-status" aria-label="Kampfstatus">
            <p>Schritt <strong id="battle-round">0</strong></p>
            <label for="player-health">Moosling <span id="player-health-text">5/5</span><progress id="player-health" max="5" value="5">5 von 5</progress></label>
            <label for="enemy-health">Konstrukt <span id="enemy-health-text">3/3</span><progress id="enemy-health" max="3" value="3">3 von 3</progress></label>
          </div>
          <p id="battle-feedback" aria-live="polite"></p>
          <div class="battle-actions">
            <button id="battle-step" type="button">Nächsten Schritt ausführen</button>
            <button id="battle-run-program" type="button">Programm ausführen</button>
            <button id="battle-restart" type="button">Neu starten</button>
            <button id="battle-exit" type="button">Zur Erkundung</button>
          </div>
          <ol id="battle-log" aria-label="Kampfprotokoll"></ol>
        </div>
      </section>
      <div id="touch-controls" aria-label="Touchsteuerung">
        <div class="dpad" role="group" aria-label="Bewegung">
          <button data-direction="up" aria-label="Nach oben">▲</button>
          <button data-direction="left" aria-label="Nach links">◀</button>
          <button data-direction="down" aria-label="Nach unten">▼</button>
          <button data-direction="right" aria-label="Nach rechts">▶</button>
        </div>
        <button id="interact-button" class="interact" aria-label="Interagieren">E<br /><span>REDEN</span></button>
      </div>
      <p id="interaction-hint" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
